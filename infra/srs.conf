# FieldCast SRS configuration — RTMP ingest + Low-Latency HLS output.
# Cameras push to rtmp://<host>:1935/live/camera1|camera2|camera3
# The backend's ffmpeg switcher re-publishes the active camera to rtmp://<host>:1935/live/active
# Viewers play http://<host>:8080/live/active.m3u8

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HTTP API — used by the admin "stream health" panel to see which streams are connected.
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP server that serves the generated HLS segments/playlists.
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# SRT contribution is more resilient on mobile networks and avoids device-
# specific RTMP H.264 packetization issues. SRS converts it into the same live
# source used by HLS and the camera switcher.
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
    connect_timeout 4000;
    peerlatency     120;
    recvlatency     120;
    latency         120;
    tsbpdmode       on;
    tlpktdrop       on;
    sendbuf         2000000;
    recvbuf         2000000;
    default_streamid "#!::r=live/livestream,m=publish";
}

# Low-latency profile for RTMP ingest (reduces glass-to-glass latency).
vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }

    publish {
        mr              off;
    }

    srt {
        enabled         on;
        srt_to_rtmp     on;
    }

    # Low-Latency HLS: 1s fragments, short window -> ~2-4s latency.
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
        hls_dispose     30;
    }
}
